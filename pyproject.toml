[project]
name = "nekopal"
version = "0.1.0"
description = "把一整块文字交给一个角色，读给你听"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# 音色丰富、需联网；缺失时自动降级到 macOS say
edge = ["edge-tts>=6.1"]
dev = ["pytest>=8"]

[project.scripts]
nekopal = "nekopal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nekopal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: 需要联网或真实 TTS 的测试（默认不运行）",
]
