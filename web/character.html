<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>猫伴 · 角色</title>
  <link rel="stylesheet" href="character.css">
</head>
<body>
  <!--
    角色窗口：**平时只有一个人物**，鼠标移到人物上才浮出旁边的半透明按钮。

    ⚠️ 角色本体现在是**占位**（🐱）：Live2D 渲染要等 Cubism Core 到位。
    接上时只需把 `.avatar` 里的内容换成 pixi 的 canvas —— 布局与交互都不用动。

    窗口本身是全透明的，且原生侧会做「精确命中」：
    只有 `.character` 和 `.actions` 这两个矩形里能点，其他地方**点穿**到桌面。
    （这两个矩形由 character.js 报给原生，见 reportHotRects）

    图标用**内联 SVG**，不用 ⏮⏯ 这类符号：
    那些字符在 WebKit 里会走**彩色 emoji 字体**，在浅色毛玻璃上糊成一团、
    根本看不出是什么 ✗（用户实测反馈）。SVG 笔锋锐利、粗细可控 ✅
  -->
  <div class="stage">
    <!-- 角色本体：唯一可拖、可点的"实体" -->
    <div class="character" id="character">
      <div class="avatar">🐱</div>
      <!-- Live2D 挂上来之后，用 .has-model 把上面的 🐱 藏起来 -->
      <canvas id="live2d"></canvas>
    </div>

    <!-- 按钮列：平时 opacity:0，鼠标移到角色上才浮出来 -->
    <div class="actions">
      <button id="prev" title="上一句" aria-label="上一句">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6v12" />
          <path d="M18 6.5 9.5 12 18 17.5Z" />
        </svg>
      </button>

      <button id="toggle" title="暂停 / 继续" aria-label="暂停或继续">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.5 7.5 13 12 5.5 16.5Z" />
          <path d="M17 7.5v9" />
          <path d="M20.5 7.5v9" />
        </svg>
      </button>

      <button id="next" title="下一句" aria-label="下一句">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6.5 14.5 12 6 17.5Z" />
          <path d="M17 6v12" />
        </svg>
      </button>

      <span class="sep"></span>

      <button id="stop" title="停止" aria-label="停止">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="2" />
        </svg>
      </button>

      <button id="close" title="关掉猫伴" aria-label="关掉猫伴">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 8l8 8" />
          <path d="M16 8l-8 8" />
        </svg>
      </button>
    </div>

    <!-- 跟读窗连没连着（绿=连上，灰=没连） -->
    <span class="dot" id="dot" title="跟读窗状态"></span>
  </div>
  <!--
    Live2D 渲染栈：
      ① Cubism Core —— Live2D 官方专有运行时（从 ~/.config/nekopal/core/ 本地中转）
      ② pet.js      —— **我们自己的**渲染外壳，用官方 Cubism 5 框架打包而成
                       （character.js 里动态 import；里面含官方框架，故不进仓库）

    ⚠️ 为什么不用 pixi-live2d-display：那个库按 Cubism **4** 写，与 Core **5**
    的多处结构对不上（canvasinfo / vertexPositions / drawOrders），硬接会散架。
    官方框架和 Core 5 是配套的。

    任一个失败都不影响别的功能：角色退回 🐱 占位（见 character.js），
    朗读、悬停按钮、拖拽、精确命中全都照常。
  -->
  <script src="/api/avatar-core/live2dcubismcore.min.js"></script>
  <script src="character.js" type="module"></script>
</body>
</html>
